<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Para Ti ❤️</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    />

    <!-- GSAP -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css" />

    <!-- JS -->
    <script defer src="script.js"></script>
</head>

<body>

    <!-- ESTRELLAS -->
    <div class="estrellas"></div>

    <div class="contenedor">

        <!-- SOBRE -->
        <div class="sobre" id="sobre">

            <div class="cuerpo"></div>

            <div class="tapa"></div>

            <!-- CARTA INTERNA -->
            <div class="carta-interna"></div>

            <div class="texto-sobre">
                💌 Toca para abrir
            </div>

        </div>

        <!-- CARTA -->
        <div class="carta oculto" id="carta">

            <div class="contenido-carta">

                <div class="emoji">
                    💖
                </div>

                <h2>Te tengo algo...</h2>

                <p>
                    Hay algo importante que quiero preguntarte ❤️
                </p>

                <button
                    class="btn btn-danger mt-3"
                    id="abrirPregunta"
                >
                    Abrir carta
                </button>

            </div>

        </div>

        <!-- PREGUNTA -->
        <div class="pregunta oculto" id="pregunta">

            <h1>¿Me amas? ❤️</h1>

            <div class="botones">

                <button id="si">
                    Sí 💖
                </button>

                <button id="no">
                    No 😶
                </button>

            </div>

            <p id="mensaje"></p>

        </div>

    </div>

</body>

</html>
